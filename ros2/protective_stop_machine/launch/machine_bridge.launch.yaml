# Bring up the machine bridge lifecycle node, optionally auto-activating it.
#
# Autostart is handled by the node itself: the 'autostart' ROS parameter makes
# the node configure() and activate() in its constructor. No launch event
# handlers (and no nav2_lifecycle_manager) are needed.
launch:
  - arg:
      name: params_file
      default: $(find-pkg-share protective_stop_machine)/config/machine_params.yaml

  - arg:
      name: autostart
      default: 'true'

  - lifecycle_node:
      pkg: protective_stop_machine
      exec: machine_bridge_node
      name: machine_bridge
      namespace: ''
      output: screen
      param:
        - from: $(var params_file)
        - name: autostart
          value: $(var autostart)
          type: bool
