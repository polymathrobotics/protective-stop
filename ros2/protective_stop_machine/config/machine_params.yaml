---
/machine_bridge:
  ros__parameters:
    backend: software  # software | hardware   (read-only)
    machine_id: 16909060  # 0x01020304            (read-only)
    frame_id: pstop_machine

    software:  # used when backend == software
      bind_addr: 0.0.0.0
      port: 8890  # read-only
      # Operator authorization (SAFETY). A bonded remote is accepted and
      # heartbeat-monitored but STOP-ONLY by default: it may command STOP but may
      # NEVER re-arm (STOP -> OK). Only a remote whose 32-bit pstop id is listed
      # in `operators` gets re-arm authority. Empty list (the default) = every
      # remote is stop-only = maximally safe out of the box.
      default_stop_only: true  # read-only
      # operators: [30234300]  # read-only; 32-bit pstop ids granted re-arm (default: none)

    hardware:  # used when backend == hardware
      device_url: http://127.0.0.1
      admin_user: admin  # password via env PSTOP_MACHINE_ADMIN_PASS

    timing:  # dynamic; validated against the safety floor
      heartbeat_ms: 400
      max_missed: 3
      min_stop_ms: 500

    rates:
      publish_rate_hz: 10.0
      state_poll_hz: 5.0  # hardware poll rate
      diagnostics_rate_hz: 1.0

    # Optional fleet check-in (software backend only). Default DISABLED (empty
    # url) so a non-fleet deployment is unaffected. When set, the node POSTs a
    # bearer-authenticated {"name","port", ...} to the console every interval_s
    # while ACTIVE, exactly like the host runner's [announce] — the console shows
    # this software machine as RUNNING alongside the hardware ones. Entirely off
    # the safety path: a dead console only logs. Prefer the ENVIRONMENT for the
    # URL + key file so secrets stay out of committed config —
    # PSTOP_ANNOUNCE_URL and PSTOP_ANNOUNCE_KEY_FILE override these two keys.
    announce:
      url: ''  # http://host[:port]/path — empty = disabled (read-only)
      key_file: ''  # path whose first line is the bearer token, chmod 600 (read-only)
      name: ''  # console display name; empty = this host's hostname (read-only)
      interval_s: 60  # seconds between check-ins (read-only)
