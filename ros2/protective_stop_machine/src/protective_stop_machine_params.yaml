---
protective_stop_machine:
  backend:
    type: string
    default_value: software
    read_only: true
    description: Machine backend to run. 'software' hosts pstop_c in-process; 'hardware' polls the ESP32 machn over HTTP. Validated in build_backend().
  machine_id:
    type: int
    default_value: 16909060  # 0x01020304
    read_only: true
    description: 32-bit machine identity advertised to bonded remotes.
  frame_id:
    type: string
    default_value: pstop_machine
    read_only: true
    description: TF frame id stamped on published machine state.

  software:
    bind_addr:
      type: string
      default_value: 0.0.0.0
      read_only: true
      description: UDP bind address for the in-process software backend.
    port:
      type: int
      default_value: 8890
      read_only: true
      description: UDP port for the in-process software backend.
      validation:
        bounds<>: [1, 65535]
    # Admission (OPTIONAL). Decides only whether a remote may BOND at all.
    # Both lists empty (the default) = every remote is admitted. A non-empty
    # allowlist admits ONLY the listed 32-bit pstop ids ("paranoid" mode); the
    # denylist always refuses the listed ids and wins over the allowlist. A
    # refused BOND is answered with UNBOND. Admission is NOT re-arm authority:
    # each remote announces its own stop-only/operator role in every frame and
    # the machine honours it live.
    allowlist:
      type: int_array
      default_value: []
      read_only: true
      description: If non-empty, only these 32-bit pstop ids may bond (e.g. [30234300]). Empty = everyone.
    denylist:
      type: int_array
      default_value: []
      read_only: true
      description: These 32-bit pstop ids may never bond, regardless of the allowlist.

  hardware:
    device_url:
      type: string
      default_value: http://127.0.0.1
      read_only: true
      description: Base URL of the ESP32 machn admin/state HTTP API.
    admin_user:
      type: string
      default_value: admin
      read_only: true
      description: HTTP basic-auth user for the device admin API (password comes from PSTOP_MACHINE_ADMIN_PASS, never a param).

  # timing.* is the only dynamic group: the bounds<>/gt_eq<> ranges below ARE the
  # SR-M-01 safety floors — the generated ParamListener rejects any out-of-floor
  # value (at declare time and on a live set) before it can apply.
  timing:
    heartbeat_ms:
      type: int
      default_value: 400
      description: Remote heartbeat window (SF-1 stop latency). Floor SR-M-01.
      validation:
        bounds<>: [50, 1000]
    max_missed:
      type: int
      default_value: 5
      description: Missed heartbeats tolerated before STOP. Floor SR-M-01. Default 5 matches the ESP32 machine (MACHN_MAX_MISSED_HEARTBEATS) — timeout hb×5 ≈ 2.0s, riding through the ~90-min control-plane re-sync RTT spikes.
      validation:
        bounds<>: [1, 5]
    min_stop_ms:
      type: int
      default_value: 500
      description: Anti-blip arming-delay floor (SF-3). Floor SR-M-01.
      validation:
        gt_eq<>: 100

  # Rates are read at configure/activate; changing them needs a restart.
  rates:
    publish_rate_hz:
      type: double
      default_value: 10.0
      read_only: true
      description: State publish rate.
      validation:
        gt_eq<>: 1.0
    state_poll_hz:
      type: double
      default_value: 5.0
      read_only: true
      description: Hardware backend /state.json poll rate.
      validation:
        gt_eq<>: 1.0
    diagnostics_rate_hz:
      type: double
      default_value: 1.0
      read_only: true
      description: diagnostic_updater refresh rate.
      validation:
        gt_eq<>: 0.1

  # Optional fleet check-in (software backend only). Default DISABLED (empty url)
  # so a non-fleet deployment is unaffected. When set, the node POSTs a
  # bearer-authenticated {"name","port", ...} to the console every interval_s
  # while ACTIVE, exactly like the host runner's [announce]. Entirely off the
  # safety path: a dead console only logs. Prefer the ENVIRONMENT for the URL +
  # key file so secrets stay out of committed config — PSTOP_ANNOUNCE_URL and
  # PSTOP_ANNOUNCE_KEY_FILE override the two keys below.
  announce:
    url:
      type: string
      default_value: ''
      read_only: true
      description: Fleet console check-in endpoint, http://host[:port]/path. Empty (default) disables check-in entirely.
    key_file:
      type: string
      default_value: ''
      read_only: true
      description: Path to a chmod-600 file whose first line is the bearer token. Empty means no Authorization header.
    name:
      type: string
      default_value: ''
      read_only: true
      description: Display name on the console. Empty (default) uses this host's hostname, like the host runner.
    interval_s:
      type: int
      default_value: 60
      read_only: true
      description: Seconds between check-ins.
      validation:
        gt_eq<>: 1

  # Optional fleet DEVICE CHECK-IN (software backend only). Registers this
  # software machine with the management backend EXACTLY like an ESP32 machine does — a
  # `device_type:"machine"` device record with full metadata — by POSTing the
  # ESP32 check-in schema to <checkin_url>/api/v1/checkin every check_interval_s
  # (plus an immediate boot check-in). Complementary to announce.* (which feeds
  # the live overview); default DISABLED (empty url). Entirely off the safety
  # path: a dead fleet only logs, and no firmware OTA is ever attempted. Prefer
  # the ENVIRONMENT for the secrets — PSTOP_CHECKIN_URL and
  # PSTOP_CHECKIN_API_KEY_FILE override the two keys below so the proprietary fleet
  # URL/key stay out of committed config.
  fleet:
    checkin_url:
      type: string
      default_value: ''
      read_only: true
      description: Fleet BASE url, http://host[:port]. The node appends /api/v1/checkin. Empty (default) disables device check-in entirely.
    api_key_file:
      type: string
      default_value: ''
      read_only: true
      description: Path to a chmod-600 file whose first line is the fleet API key (Bearer token). Empty means no Authorization header.
    check_interval_s:
      type: int
      default_value: 300
      read_only: true
      description: Seconds between device check-ins. Clamped to [60, 300] to match the ESP32 machn cadence.
      validation:
        bounds<>: [60, 300]

  autostart:
    type: bool
    default_value: true
    read_only: true
    description: If true, the node configures and activates itself on startup (default, so `ros2 run` comes up active). Set false for manual lifecycle control (tests, external lifecycle manager).
