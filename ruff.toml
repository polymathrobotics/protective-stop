# Repo-local Ruff config for the pre-commit `polymath-python` checker.
#
# The checker's own config is not reliably discovered on CI runners, so runs
# fall back to ruff's built-in defaults. quote-style here MUST match that
# built-in default ("double"): with any other value, config-discovered and
# config-missed runs rewrite each other's output and the gate ping-pongs on
# unchanged files (observed 2026-08-14). All repo Python is double-quoted.

line-length = 120
indent-width = 4

[format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
