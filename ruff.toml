# Repo-local Ruff config, mirroring polymath_code_standard v2.1.1 config/ruff.toml.
#
# The `polymath-python` checker's runtime .ruff.toml is not reliably discovered
# on CI runners; without this tracked copy, missed runs fall back to ruff's
# built-in default (double quotes) and rewrite the repo's single-quoted Python
# on unchanged files. Keep quote-style in sync with polymath_code_standard —
# a mismatch makes the gate ping-pong between resolution paths.

line-length = 120
indent-width = 4

[format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
