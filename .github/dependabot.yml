---
version: 2
updates:
  # Keep GitHub Actions (checkout, esp-idf-ci-action, setup-python, ...)
  # up to date. Minor/patch bumps are grouped into a single weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # NOTE: no Python ecosystem is enabled yet. tools/ now tracks pyproject.toml
  # and uv.lock, so `package-ecosystem: uv` on /tools would bump esptool and the
  # HIL deps; enable it when someone owns the review of those PRs. Most tools
  # there are still stdlib-only, and firmware/managed_components/ is gitignored.
