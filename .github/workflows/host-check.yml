---
name: Host build and MISRA check

# Builds the robot-side machine_app_runner (plain C, no ESP-IDF) and runs
# the free cppcheck MISRA C:2012 pre-check. The MISRA step is advisory:
# residual findings are the documented deviation register
# (docs/MISRA_COMPLIANCE_2026-07-21.md), so it never fails the build.

on:
  push:
    branches: [main]
    paths:
      - host/**
      - components/**
      - firmware/main/**
      - firmware/sdkconfig.defaults
      - machn/sdkconfig.defaults
      - scripts/check_sdkconfig_parity.sh
      - tools/misra_check.sh
      - .github/workflows/host-check.yml
  pull_request:
    paths:
      - host/**
      - components/**
      - firmware/main/**
      - firmware/sdkconfig.defaults
      - machn/sdkconfig.defaults
      - scripts/check_sdkconfig_parity.sh
      - tools/misra_check.sh
      - .github/workflows/host-check.yml

jobs:
  host_build_and_misra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck

      - name: Build host runner
        run: make -C host

      - name: Host unit tests (crypto KATs + clock guard)
        # Builds the crypto primitives at -O3 (matching production) and runs
        # the RFC 7748 / RFC 8439 / BLAKE2s golden-vector KATs, plus the
        # clock-guard tests. Fails the build on any KAT mismatch so a future
        # toolchain change can't silently miscompile safety-path crypto.
        run: make -C host test

      - name: sdkconfig parity (remote vs machine shared keys)
        # Fails the build if any setting shared by firmware/sdkconfig.defaults
        # and machn/sdkconfig.defaults drifts between the two (David,  # 84).
        run: ./scripts/check_sdkconfig_parity.sh

      - name: MISRA check (advisory)
        run: ./tools/misra_check.sh || true
