---
name: Firmware build (ESP-IDF)

# Builds pstop_remote.bin for the ESP32-S3 remote using ESP-IDF v5.5.
# Runs whenever the firmware, its shared components, or the certified
# pstop_c library change.

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - components/**
      - pstop_c/**
      - .github/workflows/firmware-build.yml
  pull_request:
    paths:
      - firmware/**
      - components/**
      - pstop_c/**
      - .github/workflows/firmware-build.yml

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The build reads firmware/sdkconfig.credentials, which is
      # gitignored (secrets). CI has no secrets, so seed it from the
      # example if present, otherwise create an empty file so the build
      # doesn't fail on a missing include.
      - name: Seed sdkconfig.credentials
        run: |
          if [ -f firmware/sdkconfig.credentials.example ]; then
            cp firmware/sdkconfig.credentials.example firmware/sdkconfig.credentials
          else
            touch firmware/sdkconfig.credentials
          fi

      # Build, then assert Option B verdict diversity survived the optimizer
      # (SR-R-03 / DU-3) — the xtensa objdump is on PATH inside the IDF action.
      - name: Build + diversity check with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware
          command: idf.py build && bash ../scripts/check_estop_diversity.sh build/pstop_remote.elf

  build_machn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Same credentials seeding as the remote build (machn merges its own
      # sdkconfig.credentials when present; CI builds generic).
      - name: Seed sdkconfig.credentials
        run: |
          if [ -f firmware/sdkconfig.credentials.example ]; then
            cp firmware/sdkconfig.credentials.example machn/sdkconfig.credentials
          else
            touch machn/sdkconfig.credentials
          fi

      - name: Build with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: machn
