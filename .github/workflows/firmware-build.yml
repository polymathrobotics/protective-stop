---
name: Firmware build (ESP-IDF)

# Builds pstop_remote.bin for the ESP32-S3 remote using ESP-IDF v5.5.
# Runs whenever the firmware, its shared components, or the certified
# pstop_c library change.

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - components/**
      - pstop_c/**
      - .github/workflows/firmware-build.yml
  pull_request:
    paths:
      - firmware/**
      - components/**
      - pstop_c/**
      - .github/workflows/firmware-build.yml

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Build, then assert Option B verdict diversity survived the optimizer
      # (SR-R-03 / DU-3) — the xtensa objdump is on PATH inside the IDF action.
      - name: Build + diversity check with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware
          command: idf.py build && bash ../scripts/check_estop_diversity.sh build/pstop_remote.elf && bash ../tools/release_guard.sh build/pstop_remote.bin build/pstop_remote.elf

  build_machn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: machn
          command: idf.py build && bash ../tools/release_guard.sh build/machn_machine.bin build/machn_machine.elf
