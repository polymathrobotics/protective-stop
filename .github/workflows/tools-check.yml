---
name: Tools environment (uv)

# Resolves the tools/ uv environment and imports every Python tool in it.
# `--locked` fails when uv.lock no longer matches pyproject.toml

on:
  push:
    branches: [main]
    paths:
      - tools/**
      - .github/workflows/tools-check.yml
  pull_request:
    paths:
      - tools/**
      - .github/workflows/tools-check.yml

permissions:
  contents: read

jobs:
  tools_env:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the environment against the lock
        run: uv sync --locked

      - name: Every tool parses
        run: uv run python -m compileall -q *.py hil safety_lint

      - name: esptool resolves
        run: |
          uv run esptool version
          uv run python flash_station.py --selftest

      - name: HIL suite collects
        run: ./hil/run.sh --collect-only -q
